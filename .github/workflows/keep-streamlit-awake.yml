name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL }}
    steps:
      - name: Ping deployed Streamlit app
        run: |
          if [ -z "$STREAMLIT_APP_URL" ]; then
            echo "::notice::Set the repository variable STREAMLIT_APP_URL to your deployed Streamlit app URL."
            exit 0
          fi

          curl --fail --location --max-time 60 --retry 3 --retry-delay 10 "$STREAMLIT_APP_URL" >/dev/null
